<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>자재 재고실사</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --header-bg: #0f172a;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      --ink: #0f172a;
      --sub: #64748b;
      --faint: #94a3b8;
      --fill: #f8fafc;
      --field-border: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --emerald: #10b981;
      --danger: #ef4444;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    svg.px { shape-rendering: crispEdges; flex-shrink: 0; }

    html, body {
      height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }

    .app {
      min-height: 100%; display: flex; flex-direction: column;
      max-width: 500px; margin: 0 auto; padding-bottom: 24px;
    }

    /* ── 상단 헤더 ── */
    .console-header {
      background: var(--header-bg); color: #fff;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
    .date-badge {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.2); color: #7dd3fc;
    }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .h-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 10px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff; font-size: 12px; font-weight: 700;
    }
    .h-btn:active { opacity: 0.8; }
    .h-btn.worker-active { background: var(--accent); }

    /* ── 카메라 뷰파인더 ── */
    .cam-card {
      margin: 12px 14px 0;
      border-radius: var(--radius-lg);
      border: 3px solid #1e293b;
      box-shadow: var(--card-shadow);
      overflow: hidden; background: #000;
      position: relative;
      height: clamp(150px, 23dvh, 210px);
      transition: height 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .cam-card.hit { border-color: var(--emerald); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25); }
    .cam-card.reject { border-color: var(--danger); }

    .app.picking .cam-card { height: 42px !important; border-color: #334155; }
    .app.picking #camVideo, .app.picking #fallbackReader, .app.picking .aim-line, .app.picking .cam-status {
      opacity: 0; pointer-events: none;
    }
    .app.picking .search-wrap { display: none; }

    #camVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    #fallbackReader { position: absolute; inset: 0; }
    #fallbackReader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #fallbackReader > div, #fallbackReader canvas { display: none !important; }

    .aim-line {
      position: absolute; z-index: 2; left: 10%; right: 10%; top: 50%; height: 1px;
      background: rgba(255, 255, 255, 0.35); pointer-events: none;
    }

    .cam-status {
      position: absolute; z-index: 3; left: 10px; right: 10px; bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.75); font-size: 11px; font-weight: 700; color: #f8fafc;
    }
    .led { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); }
    .led.torch { background: #fbbf24; }

    .cam-overlay-btn {
      position: absolute; z-index: 6; inset: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: rgba(15, 23, 42, 0.92); color: #fff; font-size: 13px; font-weight: 700;
    }
    .cam-overlay-btn small { font-size: 11px; color: #94a3b8; font-weight: 500; }

    /* ── 메인 작업 패널 ── */
    .work-card {
      margin: 10px 14px 0; padding: 14px;
      background: var(--card); border: 1.5px solid var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
      display: flex; flex-direction: column; gap: 10px;
    }

    .search-wrap { position: relative; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 12px;
      background: var(--fill); border: 1.5px solid var(--field-border);
      border-radius: var(--radius-md);
    }
    .search-box:focus-within { border-color: var(--accent); background: #fff; }
    .search-box input { flex: 1; border: 0; background: transparent; outline: none; font-size: 14px; font-weight: 600; }
    .search-box input::placeholder { color: var(--faint); font-weight: 500; }

    .suggest {
      position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px);
      max-height: 260px; overflow-y: auto;
      list-style: none; background: var(--card);
      border: 2px solid var(--ink); border-radius: var(--radius-md);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
    }
    .suggest button {
      display: flex; width: 100%; align-items: center; gap: 8px;
      padding: 11px 12px; text-align: left; font-size: 13px;
      border-bottom: 1px solid var(--card-border);
    }
    .suggest button:active { background: var(--accent-soft); }
    .s-code { font-size: 12px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .s-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s-unit { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--sub); }

    .item-monitor {
      padding: 10px 12px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .item-monitor.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.06) 0%, rgba(37, 99, 235, 0.01) 100%);
    }
    .item-monitor.reject { border-color: var(--danger); background: #fef2f2; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-code { font-size: 12px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
    .badges { display: flex; gap: 5px; }
    .badge-pill { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; background: #e2e8f0; color: #1e293b; }
    .badge-pill.mult { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
    .badge-pill.pair { background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
    .item-name { font-size: 17px; font-weight: 800; line-height: 1.25; word-break: keep-all; }
    .item-monitor.idle .item-name { color: var(--faint); font-size: 15px; font-weight: 600; }

    /* 왼쪽: 잔량 + ▲▼(±1롤) 스텝 버튼 / 오른쪽: 파렛트 */
    .counts-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 9px; }
    .slot {
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px 10px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border); cursor: text;
    }
    .slot:focus-within { border-color: var(--accent); background: #ffffff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .slot-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12px; font-weight: 800; color: var(--sub); }
    .slot-head.mult-on { color: #d97706; }
    .adj-badge {
      padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 900;
      background: #dbeafe; color: var(--accent);
    }
    .adj-badge.neg { background: #fee2e2; color: var(--danger); }

    .loose-body { display: flex; align-items: center; gap: 6px; }
    .slot input {
      width: 100%; min-width: 0; height: 34px; border: 0; background: transparent; outline: none;
      font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .slot input::placeholder { color: var(--faint); font-weight: 600; }

    .stepper-col { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .step-btn {
      width: 36px; height: 22px; border-radius: 6px;
      background: #e2e8f0; color: var(--ink);
      font-size: 11px; font-weight: 900; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #cbd5e1;
    }
    .step-btn:active:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(0.94); }
    .step-btn:disabled { opacity: 0.4; }

    .note-slot {
      display: flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 12px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border);
    }
    .note-slot:focus-within { border-color: var(--accent); background: #fff; }
    .note-slot input { flex: 1; border: 0; background: transparent; outline: none; font-size: 13px; font-weight: 600; }
    .note-slot input::placeholder { color: var(--faint); font-weight: 500; }

    .save-btn {
      width: 100%; height: 52px; padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--accent); color: #ffffff;
      box-shadow: 0 4px 0 #1e3a8a;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; font-weight: 800;
    }
    .save-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #1e3a8a; }
    .save-btn.solo { justify-content: center; }
    .save-btn:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; }
    .save-calc { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.92); }

    /* ── 하단 시트 이력 카드 ── */
    .log-card {
      margin: 12px 14px 0; background: var(--card);
      border: 1.5px solid var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow); overflow: hidden;
    }
    .log-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--fill);
      border-bottom: 1.5px solid var(--card-border);
    }
    .tab-group { display: flex; gap: 4px; }
    .tab-btn { padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 800; color: var(--sub); }
    .tab-btn.active { background: var(--ink); color: #fff; }
    .meta-tag { font-size: 11px; font-weight: 700; color: var(--sub); }

    .list { list-style: none; padding: 0 14px; max-height: 360px; overflow-y: auto; }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid var(--card-border);
      cursor: pointer; touch-action: manipulation;
    }
    .row:active { background: #f1f5f9; }
    .row:last-child { border-bottom: 0; }
    .time-chip {
      font-size: 11px; font-weight: 800; color: var(--accent);
      background: var(--accent-soft); padding: 4px 7px; border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-note { margin-top: 3px; font-size: 11px; font-weight: 700; color: #d97706; }
    .row-qty { text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .row-qty b { display: block; font-size: 16px; font-weight: 900; color: var(--ink); }
    .edit-pill {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      font-size: 11px; font-weight: 800; color: var(--accent);
    }
    .empty { padding: 24px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--faint); }

    /* ── 모달 팝업 공통 ── */
    .modal-backdrop {
      position: fixed; z-index: 90; inset: 0;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(2px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      width: 100%; max-width: 500px; max-height: 90dvh; overflow-y: auto;
      background: #fff; border-radius: 22px 22px 0 0;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
    }
    .modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--ink); }
    .modal-sub { font-size: 12px; font-weight: 700; color: var(--sub); margin-top: 2px; }
    .modal-close { padding: 7px 12px; border-radius: 8px; background: var(--fill); font-size: 13px; font-weight: 800; color: var(--sub); }
    .modal-mult-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #fef3c7; border-radius: 10px; font-size: 12px; font-weight: 700; color: #92400e;
    }
    .modal-mult-row select {
      padding: 5px 8px; border-radius: 6px; border: 1px solid #f59e0b; background: #fff; font-weight: 800;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-del {
      padding: 0 16px; height: 48px; border-radius: 12px;
      background: #fee2e2; color: var(--danger); font-size: 14px; font-weight: 800;
    }
    .btn-update {
      flex: 1; height: 48px; border-radius: 12px;
      background: var(--ink); color: #fff; font-size: 15px; font-weight: 800;
    }

    /* ★ 백필름/프린트필름 동시 입력 확인 팝업 스타일 */
    .pair-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 8px;
      background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;
      font-size: 12px; font-weight: 800; align-self: flex-start;
    }
    .pair-box {
      padding: 13px 14px; border-radius: 14px;
      background: #f8fafc; border: 1.5px solid #cbd5e1;
      display: flex; flex-direction: column; gap: 6px;
    }
    .pair-cur { font-size: 12px; font-weight: 700; color: var(--sub); }
    .pair-target { font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.35; word-break: keep-all; }
    .pair-q { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .pair-btn-col { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .btn-pair-yes {
      width: 100%; height: 52px; border-radius: 13px;
      background: var(--emerald); color: #fff;
      font-size: 16px; font-weight: 800;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-pair-yes:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }
    .btn-pair-no {
      width: 100%; height: 48px; border-radius: 13px;
      background: var(--ink); color: #fff;
      font-size: 15px; font-weight: 800;
    }

    .toast {
      position: fixed; z-index: 100; left: 50%; transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      padding: 11px 18px; border-radius: 12px;
      background: #0f172a; color: #fff;
      font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>

<main class="app" id="app">
  <header class="console-header">
    <div class="brand">
      <svg class="px" width="18" height="18" viewBox="0 0 16 16">
        <path fill="#38bdf8" d="M2 2h9v5H2z"/>
        <path fill="#0284c7" d="M3 3h7v3H3z"/>
        <path fill="#ef4444" d="M11 3h4v2h-4z"/>
        <path fill="#94a3b8" d="M5 7h4v6H5z"/>
        <path fill="#475569" d="M4 13h6v2H4z"/>
      </svg>
      <span>재고실사</span>
      <span class="date-badge" id="todayBadge">오늘</span>
    </div>
    <div class="header-actions">
      <button type="button" class="h-btn" id="workerBtn">
        <span id="workerText">작업자 입력</span>
      </button>
      <button type="button" class="h-btn" id="syncBtn">🔄</button>
    </div>
  </header>

  <section class="cam-card" id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="fallbackReader" hidden></div>
    <div class="aim-line"></div>
    <div class="cam-status">
      <span class="status-pill"><span class="led" id="camLed"></span><span id="camText">스캔 준비 중...</span></span>
      <span class="status-pill" id="camSubHint">화면 탭: 🔦조명</span>
    </div>

    <button type="button" class="cam-overlay-btn" id="camHold" hidden>
      <span>✕ 여기를 탭하거나 뒤로가기를 누르면 다시 스캔합니다</span>
    </button>
    <button type="button" class="cam-overlay-btn" id="camSleep" hidden>
      <span>🔋 절전 대기 모드 (카메라 꺼짐)</span>
      <small>화면을 탭하면 즉시 스캔이 다시 시작됩니다</small>
    </button>
  </section>

  <section class="work-card">
    <div class="search-wrap">
      <div class="search-box">
        <svg class="px" width="16" height="16" viewBox="0 0 16 16">
          <path fill="#64748b" d="M5 2h5v2H5zM3 4h2v5H3zM10 4h2v5h-2zM5 9h5v2H5zM10 10h2v2h2v2h-2v-2h-2z"/>
        </svg>
        <input id="search" type="search" placeholder="품번(예: 0010), 자재명 또는 공급업체 검색" autocomplete="off">
      </div>
      <ul class="suggest" id="suggest" hidden></ul>
    </div>

    <div class="item-monitor idle" id="item">
      <div class="item-top">
        <span class="item-code" id="itemCode">데이터 불러오는 중...</span>
        <div class="badges">
          <span class="badge-pill pair" id="itemPairBadge" hidden>🔗 세트자재</span>
          <span class="badge-pill mult" id="itemLooseUnit" hidden></span>
          <span class="badge-pill" id="itemUnit" hidden></span>
        </div>
      </div>
      <p class="item-name" id="itemName">카메라 창 안에 바코드가 들어오게 비추세요</p>
    </div>

    <!-- 왼쪽: 잔량 + ▲▼(±1롤) 스텝 버튼 / 오른쪽: 파렛트 -->
    <div class="counts-grid">
      <div class="slot" id="looseField">
        <div class="slot-head" id="looseHead">
          <span id="looseLabel">잔량 (낱개)</span>
          <span class="adj-badge" id="adjBadge" hidden>+1</span>
        </div>
        <div class="loose-body">
          <input id="loose" type="text" inputmode="decimal" placeholder="0" autocomplete="off" disabled>
          <div class="stepper-col">
            <button type="button" class="step-btn" id="btnAdjUp" title="+1롤 추가" disabled>▲</button>
            <button type="button" class="step-btn" id="btnAdjDown" title="-1롤
