<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>자재 재고실사</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- iOS 등 BarcodeDetector 미지원 브라우저용 보조 엔진 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --header-bg: #0f172a;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      --ink: #0f172a;
      --sub: #64748b;
      --faint: #94a3b8;
      --fill: #f8fafc;
      --field-border: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --emerald: #10b981;
      --danger: #ef4444;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    svg.px { shape-rendering: crispEdges; flex-shrink: 0; }

    html, body {
      height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }

    .app {
      min-height: 100%; display: flex; flex-direction: column;
      max-width: 500px; margin: 0 auto; padding-bottom: 24px;
    }

    /* ── 상단 헤더 ── */
    .console-header {
      background: var(--header-bg); color: #fff;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .h-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 11px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff; font-size: 12px; font-weight: 700;
    }
    .h-btn:active { opacity: 0.8; }
    .h-btn.worker-active { background: var(--accent); }

    /* ── 카메라 뷰파인더 (가짜 애니메이션 제거 · 화면 전체 1:1 스캔) ── */
    .cam-card {
      margin: 12px 14px 0;
      border-radius: var(--radius-lg);
      border: 3px solid #1e293b;
      box-shadow: var(--card-shadow);
      overflow: hidden; background: #000;
      position: relative;
      height: clamp(160px, 25dvh, 220px);
      transition: height 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    /* 바코드 인식 순간 초록색 테두리 피드백 */
    .cam-card.hit { border-color: var(--emerald); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25); }
    .cam-card.reject { border-color: var(--danger); }

    /* 수량 입력 중일 때 키패드 가림 방지용 슬림 바 축소 */
    .app.picking .cam-card { height: 42px !important; border-color: #334155; }
    .app.picking #camVideo, .app.picking #fallbackReader, .app.picking .aim-line, .app.picking .cam-status {
      opacity: 0; pointer-events: none;
    }
    .app.picking .search-wrap { display: none; }

    #camVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    #fallbackReader { position: absolute; inset: 0; }
    #fallbackReader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #fallbackReader > div, #fallbackReader canvas { display: none !important; }

    /* 시선 고정용 아주 얇은 정적 중앙 가이드선 1개만 표시 */
    .aim-line {
      position: absolute; z-index: 2;
      left: 10%; right: 10%; top: 50%; height: 1px;
      background: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    .cam-status {
      position: absolute; z-index: 3; left: 10px; right: 10px; bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      font-size: 11px; font-weight: 700; color: #f8fafc;
    }
    .led { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); }
    .led.torch { background: #fbbf24; }

    .cam-overlay-btn {
      position: absolute; z-index: 6; inset: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: rgba(15, 23, 42, 0.92); color: #fff;
      font-size: 13px; font-weight: 700;
    }
    .cam-overlay-btn small { font-size: 11px; color: #94a3b8; font-weight: 500; }

    /* ── 메인 작업 패널 ── */
    .work-card {
      margin: 10px 14px 0; padding: 14px;
      background: var(--card); border: 1.5px solid var(--card-border);
      border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
      display: flex; flex-direction: column; gap: 11px;
    }

    .search-wrap { position: relative; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 12px;
      background: var(--fill); border: 1.5px solid var(--field-border);
      border-radius: var(--radius-md);
    }
    .search-box:focus-within { border-color: var(--accent); background: #fff; }
    .search-box input {
      flex: 1; border: 0; background: transparent; outline: none;
      font-size: 14px; font-weight: 600;
    }
    .search-box input::placeholder { color: var(--faint); font-weight: 500; }

    .suggest {
      position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px);
      max-height: 260px; overflow-y: auto;
      list-style: none; background: var(--card);
      border: 2px solid var(--ink); border-radius: var(--radius-md);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
    }
    .suggest button {
      display: flex; width: 100%; align-items: center; gap: 8px;
      padding: 11px 12px; text-align: left; font-size: 13px;
      border-bottom: 1px solid var(--card-border);
    }
    .suggest button:active { background: var(--accent-soft); }
    .s-code { font-size: 12px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .s-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s-unit { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--sub); }

    /* 자재 정보 모니터 */
    .item-monitor {
      padding: 11px 13px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .item-monitor.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.06) 0%, rgba(37, 99, 235, 0.01) 100%);
    }
    .item-monitor.reject { border-color: var(--danger); background: #fef2f2; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-code { font-size: 12px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
    .badges { display: flex; gap: 5px; }
    .badge-pill {
      padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800;
      background: #e2e8f0; color: #1e293b;
    }
    .badge-pill.mult { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
    .item-name { font-size: 18px; font-weight: 800; line-height: 1.25; word-break: keep-all; }
    .item-monitor.idle .item-name { color: var(--faint); font-size: 15px; font-weight: 600; }

    /* 왼쪽: 잔량 / 오른쪽: 파렛트 */
    .counts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .slot {
      display: flex; flex-direction: column; gap: 4px;
      padding: 9px 12px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border);
      cursor: text;
    }
    .slot:focus-within {
      border-color: var(--accent); background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .slot-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--sub); }
    .slot-head.mult-on { color: #d97706; }
    .slot input {
      width: 100%; height: 32px; border: 0; background: transparent; outline: none;
      font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .slot input::placeholder { color: var(--faint); font-weight: 600; }

    .note-slot {
      display: flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 12px; border-radius: var(--radius-md);
      background: var(--fill); border: 1.5px solid var(--field-border);
    }
    .note-slot:focus-within { border-color: var(--accent); background: #fff; }
    .note-slot input { flex: 1; border: 0; background: transparent; outline: none; font-size: 13px; font-weight: 600; }
    .note-slot input::placeholder { color: var(--faint); font-weight: 500; }

    .save-btn {
      width: 100%; height: 52px; padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--accent); color: #ffffff;
      box-shadow: 0 4px 0 #1e3a8a;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; font-weight: 800;
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .save-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #1e3a8a; }
    .save-btn.solo { justify-content: center; }
    .save-btn:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; }
    .save-calc { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.88); }

    /* ── 하단 시트 이력 카드 ── */
    .log-card {
      margin: 12px 14px 0; background: var(--card);
      border: 1.5px solid var(--card-border); border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow); overflow: hidden;
    }
    .log-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--fill);
      border-bottom: 1.5px solid var(--card-border);
    }
    .tab-group { display: flex; gap: 4px; }
    .tab-btn { padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 800; color: var(--sub); }
    .tab-btn.active { background: var(--ink); color: #fff; }
    .meta-tag { font-size: 11px; font-weight: 700; color: var(--sub); }

    .list { list-style: none; padding: 0 14px; max-height: 320px; overflow-y: auto; }
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--card-border); }
    .row:last-child { border-bottom: 0; }
    .time-chip {
      font-size: 11px; font-weight: 800; color: var(--accent);
      background: var(--accent-soft); padding: 4px 7px; border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .row-main { flex: 1; min-width: 0; }
    .row-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-note { margin-top: 3px; font-size: 11px; font-weight: 700; color: #d97706; }
    .row-qty { text-align: right; font-variant-numeric: tabular-nums; }
    .row-qty b { display: block; font-size: 16px; font-weight: 900; color: var(--ink); }
    .row-qty span { font-size: 11px; font-weight: 700; color: var(--sub); }
    .empty { padding: 24px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--faint); }

    .toast {
      position: fixed; z-index: 100; left: 50%; transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      padding: 11px 18px; border-radius: 12px;
      background: #0f172a; color: #fff;
      font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>

<main class="app" id="app">
  <header class="console-header">
    <div class="brand">
      <svg class="px" width="20" height="20" viewBox="0 0 16 16">
        <path fill="#38bdf8" d="M2 2h9v5H2z"/>
        <path fill="#0284c7" d="M3 3h7v3H3z"/>
        <path fill="#ef4444" d="M11 3h4v2h-4z"/>
        <path fill="#94a3b8" d="M5 7h4v6H5z"/>
        <path fill="#475569" d="M4 13h6v2H4z"/>
      </svg>
      <span>재고실사 스캐너</span>
    </div>
    <div class="header-actions">
      <button type="button" class="h-btn" id="workerBtn">
        <svg class="px" width="14" height="14" viewBox="0 0 16 16">
          <path fill="#fbbf24" d="M4 2h8v3H3V3h1z"/>
          <path fill="#fde68a" d="M5 5h6v4H5z"/>
          <path fill="#60a5fa" d="M3 10h10v5H3z"/>
        </svg>
        <span id="workerText">작업자 입력</span>
      </button>
      <button type="button" class="h-btn" id="syncBtn">🔄 동기화</button>
    </div>
  </header>

  <!-- 카메라 창 (보이는 화면 100% 그대로 초고속 스캔 · 탭하면 조명 켜짐/꺼짐) -->
  <section class="cam-card" id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="fallbackReader" hidden></div>
    <div class="aim-line"></div>
    <div class="cam-status">
      <span class="status-pill"><span class="led" id="camLed"></span><span id="camText">스캔 준비 중...</span></span>
      <span class="status-pill" id="camSubHint">화면 탭: 🔦조명</span>
    </div>

    <button type="button" class="cam-overlay-btn" id="camHold" hidden>
      <span>✕ 여기를 탭하거나 뒤로가기를 누르면 다시 스캔합니다</span>
    </button>
    <button type="button" class="cam-overlay-btn" id="camSleep" hidden>
      <span>🔋 절전 대기 모드 (카메라 꺼짐)</span>
      <small>화면을 탭하면 즉시 스캔이 다시 시작됩니다</small>
    </button>
  </section>

  <!-- 입력 작업 카드 -->
  <section class="work-card">
    <div class="search-wrap">
      <div class="search-box">
        <svg class="px" width="16" height="16" viewBox="0 0 16 16">
          <path fill="#64748b" d="M5 2h5v2H5zM3 4h2v5H3zM10 4h2v5h-2zM5 9h5v2H5zM10 10h2v2h2v2h-2v-2h-2z"/>
        </svg>
        <input id="search" type="search" placeholder="품번(예: 0010), 자재명 또는 공급업체 검색" autocomplete="off">
      </div>
      <ul class="suggest" id="suggest" hidden></ul>
    </div>

    <div class="item-monitor idle" id="item">
      <div class="item-top">
        <span class="item-code" id="itemCode">데이터 불러오는 중...</span>
        <div class="badges">
          <span class="badge-pill mult" id="itemLooseUnit" hidden></span>
          <span class="badge-pill" id="itemUnit" hidden></span>
        </div>
      </div>
      <p class="item-name" id="itemName">카메라 창 안에 바코드가 들어오게 비추세요</p>
    </div>

    <!-- 왼쪽: 잔량 / 오른쪽: 파렛트 -->
    <div class="counts-grid">
      <label class="slot" id="looseField">
        <div class="slot-head" id="looseHead">
          <svg class="px" width="16" height="16" viewBox="0 0 16 16">
            <path fill="#38bdf8" d="M4 2h8v3H4zM3 5h10v8H3zM4 13h8v1H4z"/>
            <path fill="#0284c7" d="M6 3h4v1H6z"/>
            <path fill="#e0f2fe" d="M5 6h6v6H5z"/>
          </svg>
          <span id="looseLabel">잔량 (낱개)</span>
        </div>
        <input id="loose" type="text" inputmode="decimal" placeholder="0" autocomplete="off" disabled>
      </label>

      <label class="slot" id="palletField">
        <div class="slot-head">
          <svg class="px" width="16" height="16" viewBox="0 0 16 16">
            <path fill="#f59e0b" d="M3 2h4v4H3zM9 2h4v4H9zM3 7h10v4H3z"/>
            <path fill="#d97706" d="M4 3h2v2H4zM10 3h2v2h-2z"/>
            <path fill="#78350f" d="M1 12h14v2H1zM2 14h3v1H2zM7 14h2v1H7zM11 14h3v1h-3z"/>
          </svg>
          <span>파렛트 수</span>
        </div>
        <input id="pallets" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off" disabled>
      </label>
    </div>

    <div class="note-slot">
      <svg class="px" width="15" height="15" viewBox="0 0 16 16">
        <path fill="#f59e0b" d="M10 2h4v4h-4zM6 6h4v4H6zM2 10h4v4H2z"/>
      </svg>
      <input id="note" type="text" placeholder="특이사항 메모 (파손, LOT, 위치 등 — PC에서 수정 가능)" autocomplete="off" disabled>
    </div>

    <button type="button" class="save-btn solo" id="save" disabled>
      <span class="save-calc" id="calcText"></span>
      <span id="saveLabel">자재를 선택하세요</span>
    </button>
  </section>

  <!-- 하단: 작업자별 스캔 이력 & 품목별 통합집계 -->
  <section class="log-card">
    <div class="log-header">
      <div class="tab-group">
        <button type="button" class="tab-btn active" id="tabLog" onclick="setViewMode('log')">내 시트 스캔이력</button>
        <button type="button" class="tab-btn" id="tabSum" onclick="setViewMode('summary')">전체 실사집계</button>
      </div>
      <span class="meta-tag" id="recentMeta"></span>
    </div>
    <ol class="list" id="list"></ol>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyMrPtlVmS9tTHUDS5WrqNQp9LHZD1LKlKzhsRSkfuJNMENuswVDcSgni2GmwMXGkYz/exec';
const API_KEY = 'dbslcka1!';
const SLEEP_TIMEOUT_MS = 40000; // 40초간 미사용 시에만 카메라 하드웨어 전원 차단

const DEFAULT_CODE_MULTS = {
  '41370026': 2, '42270010': 3, '41370067': 4,
  '41370027': 3, '41270020': 6, '43370017': 1
};
const DEFAULT_KEYWORD_RULES = [
  { type: 'name',   match: '세퍼레이터', mult: 3 },
  { type: 'vendor', match: '한국쓰리엠', mult: 5 },
  { type: 'vendor', match: '효성티앤씨', mult: 4 }
];

const $ = (id) => document.getElementById(id);
let items = [];
let itemsByLen = [];
let excluded = [];
let current = null;
let recent = [];
let viewMode = 'log';
let currentWorker = localStorage.getItem('inv_worker') || '';
let suggestions = [];
let lastBackPress = 0;

/* ════════ 작업자 설정 ════════ */
function updateWorkerUI() {
  if (currentWorker) {
    $('workerText').textContent = currentWorker + ' (실사_' + currentWorker + ')';
    $('workerBtn').classList.add('worker-active');
  } else {
    $('workerText').textContent = '작업자 입력';
    $('workerBtn').classList.remove('worker-active');
  }
}
$('workerBtn').addEventListener('click', () => {
  const name = prompt('작업자 이름을 입력해주세요.\n구글 시트에 [실사_이름] 탭이 자동 생성되어 기록됩니다.', currentWorker);
  if (name !== null) {
    currentWorker = name.trim();
    localStorage.setItem('inv_worker', currentWorker);
    updateWorkerUI();
    renderRecent();
  }
});

function getLooseMult(item) {
  if (item.looseMult && item.looseMult >= 1) return item.looseMult;
  const c = String(item.code || '').trim();
  if (DEFAULT_CODE_MULTS.hasOwnProperty(c)) return DEFAULT_CODE_MULTS[c];
  const n = String(item.name || '').replace(/\s+/g, '');
  const v = String(item.vendor || '').replace(/\s+/g, '');
  for (const r of DEFAULT_KEYWORD_RULES) {
    const m = r.match.replace(/\s+/g, '');
    if (r.type === 'name' && n.indexOf(m) > -1) return r.mult;
    if (r.type === 'vendor' && (v.indexOf(m) > -1 || n.indexOf(m) > -1)) return r.mult;
  }
  return 1;
}

/* ════════ 1:1 보이는 영역 직결 하드웨어 바코드 엔진 ════════
   - 갤럭시 크롬: 내장 하드웨어 가속 BarcodeDetector로 화면에 보이는 영역(cropCanvas)을 초당 16회 직접 스캔
   - 수량 입력 중에는 카메라 전원을 끄지 않고 일시정지(pause)만 하여 저장 직후 0.01초 만에 다음 스캔 재개 */
let mediaStream = null;
let nativeDetector = null;
let fallbackScanner = null;
let usingFallback = false;
let camActive = false;
let scanPaused = false;
let scanTimer = null;
let sleepTimer = null;
let torchOn = false;
let lastScan = { code: '', t: 0 };

const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

function getVideoTrack() {
  if (mediaStream) {
    const tracks = mediaStream.getVideoTracks();
    if (tracks && tracks.length) return tracks[0];
  }
  const fVideo = document.querySelector('#fallbackReader video');
  if (fVideo && fVideo.srcObject) {
    const tracks = fVideo.srcObject.getVideoTracks();
    if (tracks && tracks.length) return tracks[0];
  }
  return null;
}

// 화면 터치 시 조명(손전등) 즉시 토글
$('cam').addEventListener('click', async (e) => {
  if (e.target.closest('#camHold') || e.target.closest('#camSleep')) return;
  if (!camActive || scanPaused) return;
  resetSleepTimer();
  const track = getVideoTrack();
  if (!track) return;
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('camLed').classList.toggle('torch', torchOn);
    $('camSubHint').textContent = torchOn ? '🔦 조명 켜짐 (탭: 끄기)' : '화면 탭: 🔦조명';
  } catch (err) {
    torchOn = false;
    toast('이 기기에서는 브라우저 조명 제어를 지원하지 않습니다.');
  }
});

function resetSleepTimer() {
  clearTimeout(sleepTimer);
  if (camActive && !scanPaused) {
    sleepTimer = setTimeout(() => stopCameraCompletely(), SLEEP_TIMEOUT_MS);
  }
}

async function initNativeDetector() {
  if (nativeDetector) return true;
  if (!('BarcodeDetector' in window)) return false;
  try {
    const supported = await window.BarcodeDetector.getSupportedFormats();
    const wanted = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'itf', 'upc_a', 'qr_code', 'data_matrix']
      .filter((f) => supported.indexOf(f) > -1);
    if (!wanted.length) return false;
    nativeDetector = new window.BarcodeDetector({ formats: wanted });
    return true;
  } catch (e) {
    return false;
  }
}

async function startCamera() {
  $('camSleep').hidden = true;
  $('camHold').hidden = true;

  // 이미 카메라가 켜져 있고 일시정지(수량 입력 직후) 상태라면 0.01초 만에 즉시 재개!
  if (camActive) {
    scanPaused = false;
    if (!usingFallback) {
      try { await $('camVideo').play(); } catch (e) {}
    } else if (fallbackScanner) {
      try { fallbackScanner.resume(); } catch (e) {}
    }
    $('camText').textContent = '바코드에 갖다 대면 바로 찍힙니다';
    resetSleepTimer();
    return;
  }

  $('camText').textContent = '카메라 켜는 중...';
  const hasNative = await initNativeDetector();

  if (hasNative && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      const video = $('camVideo');
      video.srcObject = mediaStream;
      await video.play();

      // 연속 자동초점 및 1.25배 광학 줌(근접 초점 흐림 방지) 세팅
      const track = getVideoTrack();
      if (track && track.getCapabilities) {
        try {
          const caps = track.getCapabilities();
          const adv = {};
          if (caps.focusMode && caps.focusMode.indexOf('continuous') > -1) adv.focusMode = 'continuous';
          if (caps.zoom && caps.zoom.max >= 1.25) adv.zoom = Math.min(caps.zoom.max, 1.25);
          if (Object.keys(adv).length) await track.applyConstraints({ advanced: [adv] });
        } catch (e) {}
      }

      usingFallback = false;
      camActive = true;
      scanPaused = false;
      $('camText').textContent = '바코드에 갖다 대면 바로 찍힙니다';
      startNativeScanLoop();
      resetSleepTimer();
      return;
    } catch (e) {}
  }

  // 보조 스캐너 (iOS 사파리 등 BarcodeDetector 미지원 환경용)
  startFallbackScanner();
}

function startNativeScanLoop() {
  clearInterval(scanTimer);
  let busy = false;

  scanTimer = setInterval(async () => {
    if (!camActive || scanPaused || busy || !nativeDetector) return;
    const video = $('camVideo');
    const camBox = $('cam');
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cw = camBox.clientWidth;
    const ch = camBox.clientHeight;
    if (!vw || !vh || !cw || !ch) return;

    busy = true;
    try {
      // ★ 화면에 실제로 보이는 영역(object-fit: cover 기준)과 100% 동일한 좌표만 잘라내어 스캔!
      const scale = Math.max(cw / vw, ch / vh);
      const visW = Math.floor(cw / scale);
      const visH = Math.floor(ch / scale);
      const sx = Math.floor((vw - visW) / 2);
      const sy = Math.floor((vh - visH) / 2);

      cropCanvas.width = visW;
      cropCanvas.height = visH;
      cropCtx.drawImage(video, sx, sy, visW, visH, 0, 0, visW, visH);

      const barcodes = await nativeDetector.detect(cropCanvas);
      if (barcodes && barcodes.length > 0) {
        const rawValue = String(barcodes[0].rawValue || '').trim();
        if (rawValue) onDecode(rawValue);
      }
    } catch (e) {
    } finally {
      busy = false;
    }
  }, 60);
}

async function startFallbackScanner() {
  usingFallback = true;
  $('camVideo').hidden = true;
  $('fallbackReader').hidden = false;

  if (!fallbackScanner) {
    const F = Html5QrcodeSupportedFormats;
    fallbackScanner = new Html5Qrcode('fallbackReader', {
      verbose: false,
      formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.ITF, F.UPC_A, F.QR_CODE, F.DATA_MATRIX]
    });
  }
  try {
    await fallbackScanner.start(
      { facingMode: 'environment' },
      { fps: 15, disableFlip: true },
      onDecode,
      () => {}
    );
    camActive = true;
    scanPaused = false;
    $('camText').textContent = '바코드에 갖다 대면 바로 찍힙니다';
    resetSleepTimer();
  } catch (e) {
    camActive = false;
    $('camSleep').hidden = false;
  }
}

// 수량 입력 중에는 카메라 전원을 끄지 않고 일시정지만 (저장 직후 0.01초 즉시 재개)
function pauseCameraForInput() {
  scanPaused = true;
  clearTimeout(sleepTimer);
  if (!usingFallback) {
    try { $('camVideo').pause(); } catch (e) {}
  } else if (fallbackScanner) {
    try { fallbackScanner.pause(true); } catch (e) {}
  }
}

// 40초 이상 사용하지 않을 때만 카메라 하드웨어 완전 종료 (배터리 보호)
async function stopCameraCompletely() {
  clearTimeout(sleepTimer);
  clearInterval(scanTimer);
  torchOn = false;
  $('camLed').classList.remove('torch');
  $('camSubHint').textContent = '화면 탭: 🔦조명';

  if (mediaStream) {
    mediaStream.getTracks().forEach((t) => t.stop());
    mediaStream = null;
  }
  if (usingFallback && fallbackScanner && camActive) {
    try { await fallbackScanner.stop(); } catch (e) {}
  }
  camActive = false;
  scanPaused = false;
  if (!current) $('camSleep').hidden = false;
}

$('camSleep').addEventListener('click', () => startCamera());

function onDecode(text) {
  const code = String(text).trim();
  const now = Date.now();
  if (code === lastScan.code && now - lastScan.t < 1200) return;
  lastScan = { code, t: now };
  if (scanPaused || current || !code) return;

  const item = items.find((m) => m.code === code) ||
               itemsByLen.find((m) => m.code.length >= 4 && code.indexOf(m.code) > -1);
  if (item) {
    $('cam').classList.add('hit');
    setTimeout(() => $('cam').classList.remove('hit'), 250);
    pick(item, 'scan');
  } else {
    rejectScan(code);
  }
}

function rejectScan(code) {
  beep(true);
  resetSleepTimer();
  $('cam').classList.add('reject');
  setTimeout(() => $('cam').classList.remove('reject'), 400);
  $('item').className = 'item-monitor reject';
  $('itemCode').textContent = code;
  $('itemName').textContent = '관리 대상 자재가 아닙니다 (단량 미등록)';
}

/* ════════ 자재 선택 · 계산 · 저장 ════════ */
function round(n) { return Math.round(n * 10000) / 10000; }
function fmt(n) { return Number(n || 0).toLocaleString('ko-KR', { maximumFractionDigits: 4 }); }
function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function pick(item, source) {
  current = item;
  pauseCameraForInput();
  $('app').classList.add('picking');
  $('camHold').hidden = false;

  const lMult = item.looseMult || 1;
  $('item').className = 'item-monitor active';
  $('itemCode').textContent = item.code + (item.vendor ? ' · ' + item.vendor : '');
  $('itemUnit').textContent = '1파렛트=' + fmt(item.unit);
  $('itemUnit').hidden = false;

  if (lMult > 1) {
    $('itemLooseUnit').textContent = '잔량 1묶음=' + lMult + '롤';
    $('itemLooseUnit').hidden = false;
    $('looseLabel').textContent = '잔량 묶음 (×' + lMult + '롤)';
    $('looseHead').classList.add('mult-on');
  } else {
    $('itemLooseUnit').hidden = true;
    $('looseLabel').textContent = '잔량 (1롤/낱개)';
    $('looseHead').classList.remove('mult-on');
  }

  $('itemName').textContent = item.name;
  ['loose', 'pallets', 'note'].forEach((id) => { $(id).disabled = false; $(id).value = ''; });
  updateCalc();
  if (source === 'scan') beep(false);
  setTimeout(() => $('loose').focus({ preventScroll: true }), 30);
}

function cancelPick() {
  current = null;
  document.activeElement && document.activeElement.blur();
  $('app').classList.remove('picking');
  $('camHold').hidden = true;
  $('item').className = 'item-monitor idle';
  $('itemCode').textContent = '관리 자재 ' + items.length + '개 로드됨';
  $('itemUnit').hidden = true;
  $('itemLooseUnit').hidden = true;
  $('looseLabel').textContent = '잔량 (낱개)';
  $('looseHead').classList.remove('mult-on');
  $('itemName').textContent = '카메라 창 안에 바코드가 들어오게 비추세요';
  ['loose', 'pallets', 'note'].forEach((id) => { $(id).disabled = true; $(id).value = ''; });
  updateCalc();
  startCamera();
}

function updateCalc() {
  const btn = $('save');
  if (!current) {
    btn.disabled = true; btn.classList.add('solo');
    $('calcText').textContent = '';
    $('saveLabel').textContent = '자재를 선택하세요';
    return null;
  }
  const lS = $('loose').value.trim().replace(',', '.');
  const pS = $('pallets').value.trim();
  const noteS = $('note').value.trim();
  const l = lS === '' ? null : Number(lS);
  const p = pS === '' ? null : Number(pS);

  if (l === null && p === null && !noteS) {
    btn.disabled = true; btn.classList.add('solo');
    $('calcText').textContent = '';
    $('saveLabel').textContent = '잔량 또는 파렛트를 입력하세요';
    return null;
  }
  const lMult = current.looseMult || 1;
  const total = round((l || 0) * lMult + (p || 0) * current.unit);
  const parts = [];
  if (l !== null && l > 0) parts.push(lMult > 1 ? '잔량(' + lMult + '×' + l + ')' : '낱개 ' + l);
  if (p !== null && p > 0) parts.push(current.unit + '×' + p);
  const screen = parts.length ? parts.join(' + ') : '메모만 저장';

  const sheetTag = '실사_' + (currentWorker || '미지정');
  btn.disabled = false; btn.classList.remove('solo');
  $('calcText').textContent = '[' + sheetTag + '] ' + screen;
  $('saveLabel').textContent = fmt(total) + '개 저장 ⏎';
  return { total, screen, pallets: p, loose: l, note: noteS };
}

function save() {
  if (!current) return;
  if (!currentWorker) {
    const w = prompt('처음 스캔 시 작업자 이름을 입력해주세요.\n(구글 시트에 [실사_이름] 탭으로 자동 분류됩니다)');
    if (w && w.trim()) {
      currentWorker = w.trim();
      localStorage.setItem('inv_worker', currentWorker);
      updateWorkerUI();
    }
  }
  const c = updateCalc();
  if (!c) return;
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const req = {
    reqId: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    code: current.code,
    name: current.name,
    vendor: current.vendor || '',
    pallets: c.pallets === null ? '' : c.pallets,
    loose: c.loose === null ? '' : c.loose,
    note: c.note || '',
    worker: currentWorker || '미지정',
    qty: c.total,
    formula: c.screen,
    time: pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()),
    ts: now.getTime(),
    state: 'pending'
  };
  recent.unshift(req);
  cancelPick();
  send(req);
}

/* ════════ 서버 통신 ════════ */
async function call(method, payload) {
  const body = Object.assign({}, payload, { key: API_KEY });
  const res = method === 'GET'
    ? await fetch(API_URL + '?' + new URLSearchParams(body))
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '오류');
  return data;
}

async function boot() {
  $('itemCode').textContent = '구글 시트 동기화 중...';
  try {
    const data = await call('GET', { action: 'boot' });
    items = (data.items || []).map((it) => Object.assign({}, it, { looseMult: getLooseMult(it) }));
    excluded = data.excluded || [];
    itemsByLen = items.slice().sort((a, b) => b.code.length - a.code.length);
    recent = (data.recent || []).map((r) => Object.assign({ state: 'done' }, r));
    if (!current) $('itemCode').textContent = '관리 자재 ' + items.length + '개 로드됨';
    renderRecent();
  } catch (e) {
    toast('동기화 실패: ' + e.message);
  }
}

async function send(req) {
  renderRecent();
  try {
    const data = await call('POST', Object.assign({ action: 'save' }, req));
    const idx = recent.indexOf(req);
    if (idx > -1) recent[idx] = Object.assign({ state: 'done' }, data.record);
  } catch (e) {
    req.state = 'failed';
    toast('저장 실패: 내역을 터치하면 다시 전송합니다.');
  }
  renderRecent();
}

/* ════════ 하단 탭 렌더링 ════════ */
function setViewMode(mode) {
  viewMode = mode;
  $('tabLog').classList.toggle('active', mode === 'log');
  $('tabSum').classList.toggle('active', mode === 'summary');
  renderRecent();
}

function renderRecent() {
  const list = $('list');
  const myLogs = currentWorker
    ? recent.filter((r) => !r.worker || r.worker === currentWorker)
    : recent;

  if (viewMode === 'log') {
    $('recentMeta').textContent = (currentWorker ? '실사_' + currentWorker : '전체') + ' · ' + myLogs.length + '건';
    if (!myLogs.length) {
      list.innerHTML = '<li class="empty">아직 스캔한 내역이 없습니다</li>';
      return;
    }
    list.innerHTML = myLogs.map((r, i) => {
      const tags = [r.code, r.vendor, r.worker ? '👤' + r.worker : '', r.formula].filter(Boolean).join(' · ');
      const noteHtml = r.note ? '<p class="row-note">📌 ' + esc(r.note) + '</p>' : '';
      return '<li class="row ' + (r.state || 'done') + '" data-i="' + i + '">' +
               '<span class="time-chip">' + esc(r.time || '--:--') + '</span>' +
               '<div class="row-main"><p class="row-name">' + esc(r.name || r.code) + '</p><p class="row-sub">' + esc(tags) + '</p>' + noteHtml + '</div>' +
               '<div class="row-qty"><b>' + fmt(r.qty) + '</b></div>' +
             '</li>';
    }).join('');
    return;
  }

  const groups = {};
  const order = [];
  recent.forEach((r) => {
    if (r.state === 'failed') return;
    if (!groups[r.code]) {
      order.push(r.code);
      groups[r.code] = { code: r.code, name: r.name, vendor: r.vendor, total: 0, count: 0, byWorker: {}, notes: [] };
    }
    const g = groups[r.code];
    g.total = round(g.total + (Number(r.qty) || 0));
    g.count += 1;
    const w = r.worker || '미지정';
    g.byWorker[w] = round((g.byWorker[w] || 0) + (Number(r.qty) || 0));
    if (r.note) g.notes.push(w + ': ' + r.note);
  });

  $('recentMeta').textContent = '총 ' + order.length + '종 집계됨';
  if (!order.length) {
    list.innerHTML = '<li class="empty">집계된 품목이 없습니다</li>';
    return;
  }
  list.innerHTML = order.map((c) => {
    const g = groups[c];
    const workerStr = Object.keys(g.byWorker).map((w) => w + '(' + fmt(g.byWorker[w]) + ')').join(' / ');
    const noteHtml = g.notes.length ? '<p class="row-note">📌 ' + esc(g.notes.join(' | ')) + '</p>' : '';
    return '<li class="row done">' +
             '<div class="row-main"><p class="row-name">' + esc(g.name) + '</p><p class="row-sub">' + esc(g.code) + (g.vendor ? ' · ' + esc(g.vendor) : '') + ' · 👤 ' + esc(workerStr) + '</p>' + noteHtml + '</div>' +
             '<div class="row-qty"><b>총 ' + fmt(g.total) + '</b><span>' + g.count + '회 스캔</span></div>' +
           '</li>';
  }).join('');
}

/* ════════ 검색 및 이벤트 ════════ */
const norm = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
$('search').addEventListener('focus', () => { pauseCameraForInput(); renderSuggest(); });
$('search').addEventListener('input', renderSuggest);

function renderSuggest() {
  const box = $('suggest');
  const q = norm($('search').value);
  const all = !q ? items : items.filter((m) => m.code.toLowerCase().indexOf(q) > -1 || norm(m.name).indexOf(q) > -1 || norm(m.vendor).indexOf(q) > -1);
  suggestions = all.slice(0, 60);
  box.innerHTML = suggestions.length
    ? suggestions.map((m, i) =>
        '<li><button type="button" data-i="' + i + '">' +
          '<span class="s-code">[' + esc(m.code) + ']</span>' +
          '<span class="s-name">' + esc(m.name) + (m.vendor ? ' · ' + esc(m.vendor) : '') + '</span>' +
          '<span class="s-unit">단량:' + fmt(m.unit) + (m.looseMult > 1 ? ' / 잔량×' + m.looseMult : '') + '</span>' +
        '</button></li>').join('')
    : '<li class="empty">일치하는 관리 자재가 없습니다</li>';
  box.hidden = false;
}

$('suggest').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  $('search').value = '';
  $('suggest').hidden = true;
  pick(suggestions[+b.dataset.i], 'search');
});

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.search-wrap') && !$('suggest').hidden) {
    $('suggest').hidden = true;
    if (!current) startCamera();
  }
});

['loose', 'pallets', 'note'].forEach((id) => $(id).addEventListener('input', updateCalc));
$('loose').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('pallets').focus(); } });
$('pallets').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
$('note').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
$('save').addEventListener('click', save);
$('camHold').addEventListener('click', cancelPick);
$('syncBtn').addEventListener('click', () => { toast('구글 시트 데이터를 새로 불러옵니다.'); boot(); });

// 앱 화면을 내리거나 다른 앱으로 전환 시 즉시 카메라 전원 차단 (배터리 보호)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    stopCameraCompletely();
  } else if (document.visibilityState === 'visible' && !current) {
    startCamera();
  }
});

function initBackGuard() {
  try {
    history.pushState({ g: 1 }, '', location.href);
    window.addEventListener('popstate', () => {
      if (!$('suggest').hidden) { $('suggest').hidden = true; history.pushState({ g: 1 }, '', location.href); return; }
      if (current) { cancelPick(); history.pushState({ g: 1 }, '', location.href); return; }
      if (Date.now() - lastBackPress > 2000) {
        lastBackPress = Date.now();
        toast('뒤로가기를 한 번 더 누르면 종료됩니다.');
        history.pushState({ g: 1 }, '', location.href);
      }
    });
  } catch (e) {}
}

let actx = null;
function beep(low) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = low ? 420 : 1450;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.09);
    if (navigator.vibrate) navigator.vibrate(low ? [70, 50, 70] : 50);
  } catch (e) {}
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ════════ 시작 ════════ */
updateWorkerUI();
initBackGuard();
boot();
startCamera();
